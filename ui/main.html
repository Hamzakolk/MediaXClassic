<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body data-page="main">
  <div class="bar"><span class="drag" style="-webkit-app-region:drag"></span>
    <span><button data-win-min title="Minimize">–</button><button data-win-close title="Close">✕</button></span></div>
  <div class="wrap">
    <div class="lcd"><div id="time">0:00</div><div id="title">Media X Classic</div></div>
    <div class="row btns">
      <button id="prev" title="Previous">⏮</button><button id="play" title="Play / Pause">►</button>
      <button id="stop" title="Stop">■</button><button id="next" title="Next">⏭</button>
      <button id="open" title="Open files">⏏</button>
    </div>
    <div class="row"><input id="seek" type="range" min="0" max="100" value="0"></div>
    <div class="row"><span>Vol</span><input id="vol" type="range" min="0" max="130" value="80" style="width:110px">
      <button id="pl" class="skin">Playlist</button><button id="eq" class="skin">EQ</button>
      <select id="skin"><option value="graphite">Graphite</option><option value="steel">Steel</option><option value="amber">Amber</option></select>
    </div>
  </div>
  <script src="app.js"></script>
</body></html>
